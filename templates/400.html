{% extends 'base.html' %}

{% block title %}Bad request | CyclePrep{% endblock %}

{% block content %}
<section class="card form-card empty-state">
    <p class="stat">400</p>
    <h1>Bad request</h1>
    <p class="muted">Something was wrong with that request. Please go back and try again.</p>
    {% if user.is_authenticated %}
        <a class="button" href="{% url 'dashboard' %}">Back to my dashboard</a>
    {% else %}
        <a class="button" href="{% url 'home' %}">Go to the home page</a>
    {% endif %}
</section>
{% endblock %}
